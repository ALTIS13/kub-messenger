# nginx config for the КУБ static SPA.
# Used by both the Dockerfile and the bare-metal VPS deployment.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Reasonable defaults
  charset utf-8;
  client_max_body_size 16m;
  server_tokens off;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

  # Tell every client to forget any cached HTTP/3 alternative service.
  #
  # Traefik advertised `Alt-Svc: h3=":443"; ma=2592000` until 2026-09-06, so a
  # browser that saw it will keep trying QUIC over UDP 443 for thirty days.
  # That is fine on an ordinary network and fatal behind a VLESS/REALITY
  # tunnel, which carries TCP only: such clients commonly drop UDP 443 outright
  # so QUIC cannot leak around the proxy, and a silent drop costs a full
  # connect timeout before the browser falls back to TCP. The symptom is "the
  # app does not open on VPN", and it is sticky — removing the advertisement
  # does not clear a cache that is already thirty days deep.
  #
  # `clear` is the mechanism defined for exactly this (RFC 7838 §3.1). It stays
  # until well past 2026-10-06, when the last cached entry has expired.
  #
  # It is repeated in every location below that declares an add_header of its
  # own, because nginx replaces the inherited set rather than adding to it: a
  # single server-level directive would silently not apply to index.html, the
  # service worker or the manifest — which are exactly the documents a client
  # fetches first.
  add_header Alt-Svc "clear" always;

  # SPA fallback — every unknown path is served as index.html so wouter
  # can take over (`/tasks`, `/admin`, `/auth/callback`, ...).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The entry document names the hashed asset filenames, so it decides which
  # build a client runs. It had no Cache-Control at all, which leaves the
  # freshness to a browser heuristic — and the Windows shell held an old
  # index.html across a deploy and kept loading the previous bundle. The same
  # reasoning already written above /sw.js applies here: cache the thing that
  # names the versions and updates stick. See D-017.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    expires off;
    add_header Alt-Svc "clear" always;
  }

  # Android App Links association must not fall through to the SPA.
  location = /.well-known/assetlinks.json {
    try_files $uri =404;
    default_type application/json;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Alt-Svc "clear" always;
  }

  # Hashed, immutable assets — cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Alt-Svc "clear" always;
    access_log off;
  }

  # Service Worker — must NEVER be cached, otherwise updates stick.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires off;
    add_header Alt-Svc "clear" always;
  }

  # PWA manifest — short cache.
  location = /manifest.json {
    add_header Cache-Control "public, max-age=300";
    add_header Alt-Svc "clear" always;
  }

  # Don't expose sourcemaps in prod by default.
  location ~ \.map$ {
    deny all;
    access_log off;
    log_not_found off;
  }
}
