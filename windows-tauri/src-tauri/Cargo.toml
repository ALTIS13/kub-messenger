[package]
name = "letscube-windows-tauri"
version = "0.2.12"
description = "LETSCUBE Windows desktop shell"
authors = ["LETSCUBE"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "letscube_windows_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1.0.149"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "system-proxy"] }
semver = "=1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# Already in the lock file transitively; naming it directly adds no new code to
# the build and gives the startup certificate check its digest.
sha2 = "=0.10.9"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"] }
tauri-plugin-updater = "=2.10.1"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
